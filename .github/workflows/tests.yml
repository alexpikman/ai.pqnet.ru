name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax check
        run: python -m py_compile server.py agent_tools.py tests/test_server.py
      - name: Frontend JavaScript syntax check
        run: |
          find frontend -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Module contract JSON validation
        run: python -m json.tool module-contract.schema.json > /dev/null
      - name: HTTP security smoke test
        run: |
          python server.py > /tmp/pqlocal-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          bad_status=000
          for attempt in $(seq 1 30); do
            bad_status=$(curl --silent --output /tmp/host-bad.json --write-out '%{http_code}' -H 'Host: malicious.com' http://127.0.0.1:8765/api/health || true)
            if [ "$bad_status" = "403" ]; then break; fi
            sleep 1
          done
          test "$bad_status" = "403"
          grep -q 'Invalid Host header' /tmp/host-bad.json
          good_status=$(curl --silent --output /tmp/host-good.json --write-out '%{http_code}' http://127.0.0.1:8765/api/health)
          test "$good_status" = "200"
          grep -q '"ok": true' /tmp/host-good.json
      - name: Unit tests
        run: python -m unittest discover -s tests -v
